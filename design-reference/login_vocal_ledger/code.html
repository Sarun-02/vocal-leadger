tertiary-fixed-dim": "#ffb3b5", "error": "#ba1a1a" }, borderRadius: { "DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px" }, spacing: { "margin-desktop": "3rem", "space-xs": "0.25rem", "margin": "1rem", "margin-tablet": "2rem", "space-md": "1rem", "space-sm": "0.5rem", "space-xl": "2rem", "space-lg": "1.5rem", "gutter-desktop": "1.5rem", "gutter-tablet": "1.5rem", "gutter": "1rem" }, fontFamily: { "title-md": ["Roboto Flex"], "label-sm": ["Roboto Flex"], "body-md": ["Roboto Flex"], "headline-sm": ["Roboto Flex"], "label-lg": ["Roboto Flex"], "headline-lg": ["Roboto Flex"], "body-lg": ["Roboto Flex"], "body-sm": ["Roboto Flex"], "display-lg-mobile": ["Roboto Flex"], "display-lg": ["Roboto Flex"], "label-md": ["Roboto Flex"], "headline-md": ["Roboto Flex"], "title-lg": ["Roboto Flex"], "title-sm": ["Roboto Flex"] }, fontSize: { "title-md": ["16px", { "lineHeight": "24px", "letterSpacing": "0.15px", "fontWeight": "600" }], "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }], "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }], "headline-sm": ["24px", { "lineHeight": "32px", "letterSpacing": "0px", "fontWeight": "500" }], "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }], "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "0px", "fontWeight": "600" }], "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }], "body-sm": ["12px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "400" }], "display-lg-mobile": ["40px", { "lineHeight": "48px", "letterSpacing": "-0.2px", "fontWeight": "500" }], "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }], "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }], "headline-md": ["28px", { "lineHeight": "36px", "letterSpacing": "0px", "fontWeight": "600" }], "title-lg": ["22px", { "lineHeight": "28px", "letterSpacing": "0px", "fontWeight": "500" }], "title-sm": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "600" }] } } } };</script></head><body class="bg-surface text-on-surface font-body-md text-body-md flex flex-col min-h-screen pt-safe pb-safe"><main class="flex-1 flex flex-col relative w-full bg-surface"><div class="flex flex-col w-full px-margin pb-space-xl">
<!-- Brand Header & Emblem -->
<div class="flex flex-col items-center text-center mt-space-lg mb-space-xl">
<div class="relative w-20 h-20 mb-space-md flex items-center justify-center rounded-2xl bg-surface-container shadow-md">
<img alt="Vocal Ledger Icon" class="w-16 h-16 object-contain rounded-xl" src="https://lh3.googleusercontent.com/aida-public/AB6AXuApwKrcG5UM1hucs8w0mlMqQFIe2tJtsSgs_Q7pIyJbA7ySeAMtGIj7K_s9s621VtxwSLdQnczVHc2RwhOAHYK__BSMWK60_FUMcTUANCqktItu2lat9HMgYBSTQT7v6TjYsaZTIIPbQmBgGJJqSqtRGYr1gPZ9wU7qqBvPU1pZaz1IyOj4plgoMx9gOUbgnLJoqZgf8EnPy7nLKO7VcgskNKrwyp2Jy__u84qX0qidNDoYp9jKVRKM"/>
<div class="absolute -bottom-1 -right-1 w-6 h-6 rounded-full bg-secondary-container flex items-center justify-center text-on-secondary-container shadow-sm">
<span class="material-symbols-outlined text-sm leading-none" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">
      Vocal Ledger
    </h1>
<p class="font-body-md text-body-md text-on-surface-variant mt-space-xs">
      Simple voice-first finance
    </p>
</div>
<!-- Form Container -->
<div class="w-full bg-surface-container-lowest rounded-2xl p-space-lg shadow-sm flex flex-col gap-space-lg">
<!-- Username / Email Input -->
<div class="flex flex-col gap-1.5 relative">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="username">
        Username or Email
      </label>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#2c4ecf] transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-3 select-none text-[22px]">
          person
        </span>
<input autocomplete="username" class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="username" placeholder="e.g. rahul.sharma" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-1.5 relative">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="password">
          Password
        </label>
</div>
<div class="relative flex items-center bg-surface-container-low rounded-xl px-space-md py-3 focus-within:bg-surface-container-lowest focus-within:shadow-[0_0_0_2px_#2c4ecf] transition-all duration-200">
<span class="material-symbols-outlined text-outline mr-3 select-none text-[22px]">
          lock
        </span>
<input autocomplete="current-password" class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="password" placeholder="••••••••" type="password"/>
<button aria-label="Toggle password visibility" class="text-outline hover:text-on-surface transition-colors p-1 flex items-center justify-center focus:outline-none" id="togglePassword" type="button">
<span class="material-symbols-outlined text-[20px]" id="eyeIcon">
            visibility
          </span>
</button>
</div>
</div>
<!-- Sign In Primary Button -->
<button class="w-full bg-primary-container text-on-primary font-label-lg text-label-lg py-3.5 px-space-lg rounded-xl shadow-md active:scale-[0.99] transition-transform duration-150 flex items-center justify-center gap-2 mt-space-xs" id="submitBtn" type="button">
<span>Sign In</span>
<span class="material-symbols-outlined text-[18px]">arrow_forward</span>
</button>
</div>
<!-- Subtle Helper Note -->
<div class="mt-space-lg text-center px-space-sm">
<p class="font-body-sm text-body-sm text-on-surface-variant">
      Default demo session. Speak or type to track seamlessly.
    </p>
</div>
</div>
<script>
  (function() {
    const passwordInput = document.getElementById('password');
    const toggleBtn = document.getElementById('togglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const submitBtn = document.getElementById('submitBtn');

    if (toggleBtn && passwordInput && eyeIcon) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = passwordInput.getAttribute('type') === 'password';
        passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
        eyeIcon.textContent = isPassword ? 'visibility_off' : 'visibility';
      });
    }

    if (submitBtn) {
      submitBtn.addEventListener('click', function() {
        submitBtn.classList.add('opacity-90');
        setTimeout(() => submitBtn.classList.remove('opacity-90'), 200);
      });
    }
  })();
</script></main></body></html>
