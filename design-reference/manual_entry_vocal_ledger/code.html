<div class="w-full flex justify-center mb-space-lg">
<div class="p-1 bg-surface-container rounded-full flex items-center w-full max-w-xs shadow-sm">
<button class="flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-tertiary-container text-on-tertiary shadow-sm" id="btn-expense" onclick="setType('expense')" type="button">
<span class="material-symbols-outlined text-[18px]">remove_circle</span>
<span>Expense</span>
</button>
<button class="flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface" id="btn-income" onclick="setType('income')" type="button">
<span class="material-symbols-outlined text-[18px]">add_circle</span>
<span>Income</span>
</button>
</div>
</div>
<div class="flex flex-col items-center justify-center py-space-lg mb-space-md">
<span class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider mb-space-xs font-medium">Amount</span>
<div class="flex items-center justify-center w-full">
<span class="font-display-lg-mobile text-display-lg-mobile text-tertiary-container font-semibold transition-colors duration-200 mr-1" id="currency-symbol">₹</span>
<input autofocus="" class="font-display-lg-mobile text-display-lg-mobile bg-transparent text-tertiary-container font-semibold w-48 text-left focus:outline-none placeholder:text-outline-variant transition-colors duration-200" id="amount-input" inputmode="decimal" placeholder="0.00" step="0.01" type="number"/>
</div>
</div>
<div class="flex flex-col gap-space-lg">
<div class="flex flex-col gap-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Category</label>
<span class="font-label-sm text-label-sm text-primary font-medium" id="selected-category-label">Food</span>
</div>
<div class="overflow-x-auto no-scrollbar -mx-margin px-margin py-1 flex items-center gap-space-sm">
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-primary-container text-on-primary transition-all shadow-sm" onclick="selectCategory(this, 'Food')" type="button">
<span class="material-symbols-outlined text-[18px]">restaurant</span>
<span class="font-label-lg text-label-lg">Food</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Transport')" type="button">
<span class="material-symbols-outlined text-[18px]">directions_car</span>
<span class="font-label-lg text-label-lg">Transport</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Groceries')" type="button">
<span class="material-symbols-outlined text-[18px]">shopping_cart</span>
<span class="font-label-lg text-label-lg">Groceries</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Shopping')" type="button">
<span class="material-symbols-outlined text-[18px]">shopping_bag</span>
<span class="font-label-lg text-label-lg">Shopping</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Bills')" type="button">
<span class="material-symbols-outlined text-[18px]">receipt_long</span>
<span class="font-label-lg text-label-lg">Bills</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Salary')" type="button">
<span class="material-symbols-outlined text-[18px]">account_balance_wallet</span>
<span class="font-label-lg text-label-lg">Salary</span>
</button>
<button class="category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all" onclick="selectCategory(this, 'Other')" type="button">
<span class="material-symbols-outlined text-[18px]">more_horiz</span>
<span class="font-label-lg text-label-lg">Other</span>
</button>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant font-medium" for="desc-input">Description</label>
<div class="flex items-center gap-space-sm bg-surface-container-lowest rounded-xl px-space-md py-3 shadow-[0px_1px_3px_rgba(15,23,42,0.05)] focus-within:ring-2 focus-within:ring-primary focus-within:ring-offset-0">
<span class="material-symbols-outlined text-outline text-[20px]">edit_note</span>
<input class="w-full bg-transparent font-body-lg text-body-lg text-on-surface placeholder:text-outline focus:outline-none" id="desc-input" placeholder="e.g., Dinner with friends" type="text"/>
</div>
</div>
<div class="flex flex-col gap-space-xs">
<label class="font-label-md text-label-md text-on-surface-variant font-medium">Date</label>
<div class="relative flex items-center justify-between bg-surface-container-lowest rounded-xl px-space-md py-3 shadow-[0px_1px_3px_rgba(15,23,42,0.05)] cursor-pointer">
<div class="flex items-center gap-space-sm">
<span class="material-symbols-outlined text-primary text-[20px]">calendar_today</span>
<span class="font-title-sm text-title-sm text-on-surface" id="display-date">Today, Oct 5, 2026</span>
</div>
<span class="material-symbols-outlined text-outline text-[20px]">expand_more</span>
<input class="absolute inset-0 opacity-0 cursor-pointer w-full h-full" id="date-native" onchange="updateDateDisplay(this.value)" type="date" value="2026-10-05"/>
</div>
</div>
</div>
<div class="mt-space-xl pt-space-md">
<button class="w-full flex items-center justify-center gap-space-xs h-14 rounded-full bg-primary-container text-on-primary font-label-lg text-label-lg shadow-[0px_4px_6px_-1px_rgba(44,78,207,0.25)] hover:opacity-95 active:scale-[0.99] transition-all" id="save-button" onclick="handleSave()" type="button">
<span class="material-symbols-outlined text-[20px]">check</span>
<span>Save Transaction</span>
</button>
</div>
</div>
<script>
  let currentType = 'expense';
  let currentCategory = 'Food';

  function setType(type) {
    currentType = type;
    const btnExpense = document.getElementById('btn-expense');
    const btnIncome = document.getElementById('btn-income');
    const amountInput = document.getElementById('amount-input');
    const currencySymbol = document.getElementById('currency-symbol');
    const saveBtn = document.getElementById('save-button');

    if (type === 'expense') {
      btnExpense.className = "flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-tertiary-container text-on-tertiary shadow-sm";
      btnIncome.className = "flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      
      amountInput.classList.remove('text-secondary');
      amountInput.classList.add('text-tertiary-container');
      currencySymbol.classList.remove('text-secondary');
      currencySymbol.classList.add('text-tertiary-container');
      
      saveBtn.classList.remove('bg-secondary');
      saveBtn.classList.add('bg-primary-container');
    } else {
      btnIncome.className = "flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 bg-secondary text-on-secondary shadow-sm";
      btnExpense.className = "flex-1 flex items-center justify-center gap-space-xs py-2 rounded-full font-label-lg text-label-lg transition-all duration-200 text-on-surface-variant hover:text-on-surface";
      
      amountInput.classList.remove('text-tertiary-container');
      amountInput.classList.add('text-secondary');
      currencySymbol.classList.remove('text-tertiary-container');
      currencySymbol.classList.add('text-secondary');
      
      saveBtn.classList.remove('bg-primary-container');
      saveBtn.classList.add('bg-secondary');
    }
  }

  function selectCategory(element, name) {
    currentCategory = name;
    document.querySelectorAll('.category-chip').forEach(chip => {
      chip.className = "category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high transition-all";
    });
    
    element.className = "category-chip shrink-0 flex items-center gap-space-xs px-space-md py-2 rounded-full bg-primary-container text-on-primary transition-all shadow-sm";
    document.getElementById('selected-category-label').innerText = name;
  }

  function updateDateDisplay(val) {
    if (!val) return;
    const dateObj = new Date(val + 'T00:00:00');
    const options = { month: 'short', day: 'numeric', year: 'numeric' };
    const formatted = dateObj.toLocaleDateString('en-US', options);
    
    const today = new Date();
    const isToday = today.toISOString().split('T')[0] === val;
    document.getElementById('display-date').innerText = (isToday ? 'Today, ' : '') + formatted;
  }

  function handleSave() {
    const amountVal = document.getElementById('amount-input').value;
    const descVal = document.getElementById('desc-input').value;
    const saveBtn = document.getElementById('save-button');
    
    saveBtn.classList.add('scale-95');
    setTimeout(() => saveBtn.classList.remove('scale-95'), 150);
  }
</script></main></body></html>
